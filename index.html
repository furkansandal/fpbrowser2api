    "id": "gpt-image-2",
    "type": "image",
    "title": "GPT Image 2",
    "displayTitle": "🎨 GPT Image · 异步 API 接入文档（`/v1/videos` 统一版）",
    "file": "图片生成接口-gpt-image2.md",
    "endpoint": "POST /v1/videos · GET /v1/videos/{id}",
    "models": [],
    "content": "# 🎨 GPT Image · 异步 API 接入文档（`/v1/videos` 统一版）\n\n> **唯一路径**：`POST /v1/videos`（提交） + `GET /v1/videos/{id}`（轮询） —— NEW API 原生异步任务支持，**0 配置即用**，自带进度条 +\n\n---\n\n##文生图\n\n```bash\n# ① 提交（走 /v1/videos，NEW API 自动当异步任务跟踪 → 进度条 + 失败退款 + 任务历史）\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer apikey\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"gpt-image-2-2K\",\n    \"prompt\": \"retro neon poster, cyberpunk girl\",\n    \"aspect_ratio\": \"9:16\"\n  }'\n---\n\n##多图生图\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer apikey\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"gpt-image-2-2K\",\n    \"prompt\": \"the character from the reference photo, in a futuristic city\",\n    \"aspect_ratio\": \"16:9\",\n    \"image_urls\": [\n      \"https://your-cdn.com/character.jpg\",\n      \"https://your-cdn.com/scene.jpg\"\n    ]\n  }'\n\n---\n\n## 1. 完整调用流程\n\n### Step 1 · 提交任务\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer apikey\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"gpt-image-2-2K\",\n    \"prompt\": \"retro neon poster\",\n    \"image_urls\": [\"https://your-cdn.com/ref.jpg\"]\n  }'\n```\n\n立即返回（< 1 秒）：\n\n```json\n{\n  \"id\": \"8c7e4b...\",\n  \"task_id\": \"8c7e4b...\",\n  \"object\": \"video\",\n  \"created_at\": 1714200000,\n  \"status\": \"queued\",\n  \"progress\": 0,\n  \"video_url\": null,\n  \"prompt\": \"retro neon poster\",\n  \"aspect_ratio\": \"16:9\",\n  \"model\": \"gpt-image-2-2K-16x9\"\n}\n```\n\n### Step 2 · 轮询任务\n**轮询策略**：\n### Step 3 · 状态判断\n\n| `status` | 含义 | 该做什么 |\n|---|---|---|\n| `queued` | 排队中 | 继续轮询 |\n| `in_progress` | 生成中（progress 0–99） | 继续轮询 |\n| `completed` | 完成 | 取 `video_url`（图片直链 .png） |\n| `failed` | 失败 | 看 `error.message` |\n\n完成响应：\n\n```json\n{\n  \"id\": \"8c7e4b...\",\n  \"object\": \"video\",\n  \"status\": \"completed\",\n  \"progress\": 100,\n  \"video_url\": \"https://YOUR-HOST/generated/8c7e4b....png\",\n  \"completed_at\": 1714200068,\n  \"aspect_ratio\": \"9:16\"\n}\n```\n"
  },
  {
    "id": "nana-banana",
    "type": "image",
    "title": "Nana Banana",
    "displayTitle": "🖼️ Nana Banana 2 / Nana Banana Pro · 图片异步 API 接入文档（`/v1/videos`）",
    "file": "图片生成接口-nana-banana.md",
    "endpoint": "POST /v1/videos · GET /v1/videos/{id}",
    "models": [
      "nana-banana-2",
      "nana-banana-pro"
    ],
    "content": "# 🖼️ Nana Banana 2 / Nana Banana Pro · 图片异步 API 接入文档（`/v1/videos`）\n\n> **提交任务**：`POST /v1/videos`  \n> **查询进度**：`GET /v1/videos/{task_id}`  \n> 支持：文生图、多参考图生成图片\n\n虽然入口路径是 `/v1/videos`，但这两个模型的最终结果是图片；完成后读取 `image_url` 或 `url`。\n\n## 1. 支持模型\n\n| 模型 | 输出 | 说明 |\n|---|---|---|\n| `nana-banana-2` | 图片 | 标准图片生成 |\n| `nana-banana-pro` | 图片 | Pro 图片生成 |\n\n## 2. 完整调用流程\n\n### Step 1 · 提交任务\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"nana-banana-2\",\n    \"prompt\": \"a cute banana mascot wearing sunglasses, studio lighting, high detail\",\n    \"aspect_ratio\": \"1:1\",\n    \"resolution\": \"1k\"\n  }'\n```\n\n立即返回：\n\n```json\n{\n  \"id\": \"v_8c7e4b...\",\n  \"task_id\": \"v_8c7e4b...\",\n  \"object\": \"video\",\n  \"created_at\": 1714200000000,\n  \"status\": \"queued\",\n  \"progress\": 0,\n  \"model\": \"nana-banana-2\",\n  \"video_url\": null,\n  \"metadata\": { \"result_urls\": [] },\n  \"aspect_ratio\": \"1:1\",\n  \"prompt\": \"a cute banana mascot wearing sunglasses, studio lighting, high detail\"\n}\n```\n\n### Step 2 · 轮询任务\n\n```bash\ncurl https://xxx.xxx.xxx/v1/videos/v_8c7e4b... \\\n  -H \"Authorization: Bearer api-key\"\n```\n\n完成响应：\n\n```json\n{\n  \"id\": \"v_8c7e4b...\",\n  \"task_id\": \"v_8c7e4b...\",\n  \"object\": \"video\",\n  \"created_at\": 1714200000000,\n  \"status\": \"completed\",\n  \"progress\": 100,\n  \"model\": \"nana-banana-2\",\n  \"video_url\": null,\n  \"image_url\": \"https://xxx.xxx.xxx/generated/image.jpg\",\n  \"url\": \"https://xxx.xxx.xxx/generated/image.jpg\",\n  \"metadata\": {\n    \"result_urls\": [\"https://xxx.xxx.xxx/generated/image.jpg\"]\n  },\n  \"completed_at\": 1714200180000\n}\n```\n\n| `status` | 含义 | 该做什么 |\n|---|---|---|\n| `queued` | 排队中 | 继续轮询 |\n| `processing` | 生成中 | 继续轮询 |\n| `completed` | 已完成 | 取 `image_url` 或 `url` |\n| `failed` | 失败 | 查看 `error.message` |\n\n建议每 3–5 秒轮询一次。\n\n## 3. 调用示例\n\n### 3.1 Nana Banana 2 · 文生图\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"nana-banana-2\",\n    \"prompt\": \"a playful banana mascot in a modern 3D icon style\",\n    \"aspect_ratio\": \"1:1\",\n    \"resolution\": \"1k\"\n  }'\n```\n\n### 3.2 Nana Banana 2 · 多参考图生成图片\n\n最多 10 张参考图。\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"nana-banana-2\",\n    \"prompt\": \"make a poster using the character style and product reference\",\n    \"aspect_ratio\": \"4:3\",\n    \"resolution\": \"1k\",\n    \"images\": [\n      \"https://your-cdn.com/character.jpg\",\n      \"https://your-cdn.com/product.jpg\"\n    ]\n  }'\n```\n\n### 3.3 Nana Banana Pro · 文生图\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"nana-banana-pro\",\n    \"prompt\": \"premium editorial product photo, luxury magazine style, soft studio light\",\n    \"aspect_ratio\": \"16:9\",\n    \"resolution\": \"2k\"\n  }'\n```\n\n### 3.4 Nana Banana Pro · 多参考图生成图片\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"nana-banana-pro\",\n    \"prompt\": \"create a premium campaign image using all references\",\n    \"aspect_ratio\": \"9:16\",\n    \"resolution\": \"2k\",\n    \"images\": [\n      \"https://your-cdn.com/product.jpg\",\n      \"https://your-cdn.com/background-style.jpg\",\n      \"https://your-cdn.com/brand-color.jpg\"\n    ]\n  }'\n```\n\n单参考图也可以使用：\n\n```json\n{\n  \"image_url\": \"https://your-cdn.com/reference.jpg\"\n}\n```\n\n## 4. 请求字段\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| `model` | string | ✅ | `nana-banana-2` 或 `nana-banana-pro` |\n| `prompt` | string | ✅ | 生成提示词 |\n| `aspect_ratio` | string | ❌ | 默认 `16:9`；支持 `1:1` / `4:3` / `3:4` / `16:9` / `9:16` |\n| `resolution` | string | ❌ | 默认 `1k`；支持 `1k` / `2k` |\n| `images` | string[] | ❌ | 多参考图 URL 数组，最多 10 张 |\n| `image_url` / `first_image_url` | string | ❌ | 单参考图 URL |\n| `duration` | int | ❌ | 图片生成不需要传 |\n\n## 5. 响应字段\n\n| 字段 | 类型 | 说明 |\n|---|---|---|\n| `id` / `task_id` | string | 任务 ID |\n| `object` | string | 固定为 `video`（接口兼容字段） |\n| `created_at` | int | 创建时间戳，毫秒 |\n| `status` | string | `queued` / `processing` / `completed` / `failed` |\n| `progress` | int | 0–100 |\n| `model` | string | 请求模型 |\n| `video_url` | null | 图片模型通常为 `null` |\n| `image_url` | string\\|null | 完成后的图片地址 |\n| `url` | string\\|null | 最终结果地址，通常等于 `image_url` |\n| `metadata.result_urls` | string[] | 最终结果地址数组 |\n| `completed_at` | int | 完成时间戳，毫秒 |\n| `error.message` | string | 失败原因 |\n"
  },

    "id": "sora-2",

    "title": "Sora 2",
    "displayTitle": "🎬 Sora 2 · 异步 API 接入文档（`/v1/videos` 统一版）",
    "file": "视频生成接口-sora-2.md",
    "endpoint": "POST /v1/videos · GET /v1/videos/{id}",
    "models": [
      "sora-2"

    "content": "# 🎬 Sora 2 · 异步 API 接入文档（`/v1/videos` 统一版）\n> **唯一路径**：`POST /v1/videos`（提交） + `GET /v1/videos/{id}`（轮询） —— NEW API 原生异步任务支持\nsora-2只支持一张参考图\n\n## 1. 完整调用流程\n### Step 1 · 提交任务\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"sora-2\",\n    \"prompt\": \"...\",\n    \"aspect_ratio\": \"16:9\",\n    \"duration\": 12,\n    \"image\": \"https://...\",\n  }'\n```\n立即返回：\n```json\n{\n  \"id\": \"v_8c7e4b...\",\n  \"task_id\": \"v_8c7e4b...\",\n  \"object\": \"video\",\n  \"created_at\": 1714200000,\n  \"status\": \"queued\",\n  \"progress\": 0,\n  \"video_url\": null,\n  \"prompt\": \"...\",\n  \"aspect_ratio\": \"16:9\",\n  \"duration\": 12,\n  \"model\": \"sora-2\"\n}\n```\n\n### Step 2 · 轮询\n```bash\ncurl https://xxx.xxx.xxx/v1/videos/v_8c7e4b... \\\n  -H \"Authorization: api-key\"\n```\n完成响应：\n\n```json\n{\n  \"id\": \"v_8c7e4b...\",\n  \"object\": \"video\",\n  \"status\": \"completed\",\n  \"progress\": 100,\n  \"video_url\": \"https://xxx.xxx.xxx/generated/v_8c7e4b....mp4\",\n  \"completed_at\": 1714200180,\n  \"aspect_ratio\": \"16:9\",\n  \"duration\": 12\n}\n| `status` | 含义 | 该做什么 |\n|---|---|---|\n| `queued` | 排队中 | 继续轮询 |\n| `in_progress` | 生成中（progress 0–99） | 继续轮询 |\n| `completed` | 完成 | 取 `video_url`（.mp4 直链） |\n| `failed` | 失败 | 看 `error.message` |\n```\n\n## 3. 案例集\n\n### 案例 1 · 文生短视频\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"sora-2\",\n    \"prompt\": \"a golden retriever puppy running through a field of sunflowers, slow motion, sunny afternoon\",\n    \"duration\": 12,\n    \"aspect_ratio\": \"16:9\"\n  }'\n```\n\n### 案例 2 · 图生视频 \n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"sora-2\",\n    \"prompt\": \"the character in the photo turns slowly toward the camera and smiles, soft cinematic lighting\",\n    \"duration\": 12,\n    \"aspect_ratio\": \"9:16\",\n    \"image\": \"https://your-cdn.com/portrait.jpg\"\n  }'\n```\n\n\n## 4. 完整字段表\n\n### 4.1 提交字段\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| `model` | string | ✅ | `sora-2`|\n| `prompt` | string | ✅\\* | `prompt` 或 `image` 至少一项 |\n| `aspect_ratio` | string | ❌ | `16:9` / `9:16`；默认 `16:9` |\n| `duration` | int | ❌ | `12`\n| `image` | string\\|array | ❌ | 单图 URL（首帧）或多图数组 |\n| `messages` | array | ❌ | OpenAI Chat 风格 |\n\n### 4.2 响应字段\n\n| 字段 | 类型 | 说明 |\n|---|---|---|\n| `id` / `task_id` | string | 任务 ID（双字段兼容） |\n| `object` | string | 固定 `\"video\"` |\n| `created_at` | int | 提交时间戳 |\n| `status` | string | `queued` / `in_progress` / `completed` / `failed` |\n| `progress` | int | 0–100 |\n| `video_url` | string\\|null | 完成时是 mp4 直链 |\n| `metadata.result_urls` | string[] | `[video_url]`（NEW API 兼容字段） |\n| `prompt` / `aspect_ratio` / `duration` / `model` | – | 回显 |\n| `completed_at` | int | 完成时间戳 |\n| `error` | object | 失败时 `{message, code}` |"

    "content": "# 🎬 Sora Pro 2 · 视频任务接口说明（`/v1/videos`）\n\n视频任务接口，支持文生视频、图生视频、任务查询和鉴权下载。示例均使用主站对外地址，不包含第三方域名或账号信息。\n\n> **基础地址**：`https://your-newapi.com` 为参考，真实接入请按照当前网站地址。  \n> **创建任务**：`POST /v1/videos`  \n> **查询状态**：`GET /v1/videos/{task_id}`  \n> **下载内容**：`GET /v1/videos/{task_id}/content`  \n> **鉴权方式**：`Authorization: Bearer YOUR_API_KEY`  \n> **请求格式**：`Content-Type: application/json`  \n> **推荐轮询间隔**：5 秒\n\n请使用当前账号分配的 API Key。不要在公开页面、截图或群聊中泄露完整密钥。\n\n## 1. 适用模型\n\n| 模型 | 输出 | 说明 |\n|---|---|---|\n| `sora-vip3-pro-720p` | 480p、720p | 适合常规短视频与预览生成 |\n| `sora-vip3-pro-1080p` | 480p、720p、1080p | 适合正式交付和高清素材 |\n\n## 2. 创建视频任务\n\n| 方法 | 路径 | 说明 |\n|---|---|---|\n| `POST` | `/v1/videos` | 提交文生视频或图生视频任务，成功后返回任务 ID |\n\n### 文生视频请求体\n\n```json\n{\n  \"model\": \"sora-vip3-pro-720p\",\n  \"prompt\": \"雨夜霓虹街道，镜头缓慢推进，电影感光影\",\n  \"aspect_ratio\": \"16:9\",\n  \"resolution\": \"720p\",\n  \"seconds\": \"5\"\n}\n```\n\n### 图生视频请求体\n\n```json\n{\n  \"model\": \"sora-vip3-pro-1080p\",\n  \"prompt\": \"保持人物外貌和服装一致，自然缓慢走动\",\n  \"image_url\": \"https://example.com/input-image.jpg\",\n  \"aspect_ratio\": \"16:9\",\n  \"resolution\": \"1080p\",\n  \"seconds\": \"5\"\n}\n```\n\n### 成功返回示例\n\n```json\n{\n  \"id\": \"task_xxx\",\n  \"object\": \"video\",\n  \"model\": \"sora-vip3-pro-720p\",\n  \"status\": \"queued\",\n  \"progress\": 0,\n  \"created_at\": 1779560000\n}\n```\n\n## 3. 查询任务状态\n\n| 方法 | 路径 | 说明 |\n|---|---|---|\n| `GET` | `/v1/videos/{task_id}` | 查询任务状态、进度和完成后的结果地址 |\n\n### 完成态返回示例\n\n```json\n{\n  \"id\": \"task_xxx\",\n  \"task_id\": \"task_xxx\",\n  \"object\": \"video\",\n  \"model\": \"sora-vip3-pro-1080p\",\n  \"status\": \"completed\",\n  \"progress\": 100,\n  \"created_at\": 1779560000,\n  \"completed_at\": 1779560150,\n  \"seconds\": \"5\",\n  \"size\": \"1920x1080\",\n  \"video_url\": \"https://your-newapi.com/v1/videos/task_xxx/content\",\n  \"url\": \"https://your-newapi.com/v1/videos/task_xxx/content\"\n}\n```\n\n| 状态 | 说明 |\n|---|---|\n| `queued` | 任务已提交，等待执行 |\n| `in_progress` | 任务执行中 |\n| `completed` | 任务完成，可读取 `video_url` 或 `url` |\n| `failed` | 任务失败，请查看错误信息或重新提交 |\n\n## 4. 下载视频内容\n\n| 方法 | 路径 | 说明 |\n|---|---|---|\n| `GET` | `/v1/videos/{task_id}/content` | 返回视频二进制内容，通常为 `video/mp4` |\n\n下载内容时同样需要携带 `Authorization: Bearer YOUR_API_KEY`。建议任务完成后尽快下载或转存到自己的存储。\n\n## 5. 支持参数\n\n| 参数 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| `model` | string | 是 | 视频模型名 |\n| `prompt` | string | 是 | 视频生成提示词 |\n| `aspect_ratio` | string | 是 | 输出比例 |\n| `resolution` | string | 是 | 输出分辨率 |\n| `seconds` | string / number | 是 | 视频时长 |\n| `image_url` | string | 否 | 主参考图，用于图生视频 |\n| `reference_image_urls` | array | 否 | 多张参考图 |\n| `reference_video` | string | 否 | 参考视频 |\n| `audio_url` | string | 否 | 参考音频 |\n\n## 6. 参数范围\n\n| 类别 | 支持值 |\n|---|---|\n| 比例 | `16:9`、`9:16`、`4:3`、`3:4`、`1:1`、`21:9` |\n| 时长 | `5`、`10`、`15` 秒 |\n| `sora-vip3-pro-720p` 分辨率 | `480p`、`720p` |\n| `sora-vip3-pro-1080p` 分辨率 | `480p`、`720p`、`1080p` |\n\n## 7. 推荐接入流程\n\n1. 调用 `POST /v1/videos` 创建视频任务。\n2. 保存返回的 `id` 或 `task_id`。\n3. 每隔约 5 秒轮询 `GET /v1/videos/{task_id}`。\n4. 状态为 `completed` 后，读取 `video_url` 或 `url`。\n5. 携带鉴权请求 `/v1/videos/{task_id}/content` 下载视频内容。\n\n## 8. 快速接入示例\n\n### 创建文生视频任务\n\n```bash\ncurl -X POST 'https://your-newapi.com/v1/videos' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"model\": \"sora-vip3-pro-720p\",\n    \"prompt\": \"雨夜霓虹街道，镜头缓慢推进，电影感光影\",\n    \"aspect_ratio\": \"16:9\",\n    \"resolution\": \"720p\",\n    \"seconds\": \"5\"\n  }'\n```\n\n### 创建图生视频任务\n\n```bash\ncurl -X POST 'https://your-newapi.com/v1/videos' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"model\": \"sora-vip3-pro-1080p\",\n    \"prompt\": \"保持人物外貌和服装一致，自然缓慢走动\",\n    \"image_url\": \"https://example.com/input-image.jpg\",\n    \"aspect_ratio\": \"16:9\",\n    \"resolution\": \"1080p\",\n    \"seconds\": \"5\"\n  }'\n```\n\n### 查询任务\n\n```bash\ncurl 'https://your-newapi.com/v1/videos/{task_id}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'\n```\n\n### 下载结果\n\n```bash\ncurl 'https://your-newapi.com/v1/videos/{task_id}/content' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  --output result.mp4\n```\n\n## 9. 接入注意事项\n\n### 任务异步执行\n\n视频生成耗时会随模型、分辨率、时长、参考素材和提示词复杂度波动。正式业务建议以前端或服务端轮询任务状态为主。\n\n### 参考素材\n\n图生视频请提供可访问、清晰、完整的参考图地址。参考图质量会直接影响生成稳定性。\n\n### 结果下载\n\n结果地址不是公开免鉴权链接，请继续携带 API Key 下载，并在结果可用后及时转存。\n"

 失败 | 查看 `error.message` |\n\n建议每 3–5 秒轮询一次。\n\n## 3. 调用示例\n\n### 3.1 首帧 / 首尾帧生成视频\n\n`images` 顺序为：`[首帧图, 尾帧图]`。只传 1 张时表示首帧图。\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"veo-3-1\",\n    \"prompt\": \"the subject walks forward and the camera slowly pushes in\",\n    \"duration\": 8,\n    \"aspect_ratio\": \"9:16\",\n    \"images\": [\n      \"https://your-cdn.com/first.jpg\",\n      \"https://your-cdn.com/last.jpg\"\n    ]\n  }'\n```\n\n也可以写成：\n\n```json\n{\n  \"first_image_url\": \"https://your-cdn.com/first.jpg\",\n  \"last_image_url\": \"https://your-cdn.com/last.jpg\"\n}\n```\n\n### 3.2 多参考图生成视频\n\n多参考图字段使用 `Ingredients_images`，最多 6 张。\n\n```bash\ncurl -X POST https://xxx.xxx.xxx/v1/videos \\\n  -H \"Authorization: Bearer api-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"veo-3-1\",\n    \"prompt\": \"combine these references into a cinematic product launch video\",\n    \"duration\": 8,\n    \"aspect_ratio\": \"16:9\",\n    \"Ingredients_images\": [\n      \"https://your-cdn.com/ref-1.jpg\",\n      \"https://your-cdn.com/ref-2.jpg\",\n      \"https://your-cdn.com/ref-3.jpg\"\n    ]\n  }'\n```\n\n## 4. 请求字段\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| `model` | string | ✅ | 固定传 `veo-3-1` |\n| `prompt` | string | ✅ | 生成提示词 |\n| `duration` | int | ✅ | 固定 `8` |\n| `aspect_ratio` | string | ❌ | 默认 `16:9`；支持 `16:9` / `9:16` |\n| `images` | string[] | ❌ | 首帧 / 首尾帧图片数组，最多 2 张，顺序为 `[首帧, 尾帧]` |\n| `first_image_url` / `image_url` | string | ❌ | 首帧图 URL |\n| `last_image_url` / `end_image_url` | string | ❌ | 尾帧图 URL；不能只传尾帧 |\n| `Ingredients_images` | string[] | ❌ | 多参考图生成视频，最多 6 张；也可写 `ingredients_images` |\n\n## 5. 响应字段\n\n| 字段 | 类型 | 说明 |\n|---|---|---|\n| `id` / `task_id` | string | 任务 ID |\n| `object` | string | 固定为 `video` |\n| `created_at` | int | 创建时间戳，毫秒 |\n| `status` | string | `queued` / `processing` / `completed` / `failed` |\n| `progress` | int | 0–100 |\n| `model` | string | 请求模型 |\n| `video_url` | string\\|null | 完成后的视频地址 |\n| `url` | string\\|null | 最终结果地址，通常等于 `video_url` |\n| `metadata.result_urls` | string[] | 最终结果地址数组 |\n| `completed_at` | int | 完成时间戳，毫秒 |\n| `error.message` | string | 失败原因 |\n"

    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const slug=s=>String(s).toLowerCase().replace(/[`*#]/g,'').replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'');
    function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
    function md(x){const a=x.replace(/\r\n/g,'\n').split('\n');let h='',i=0,code=false,lang='',buf=[];const fc=()=>{h+=`<pre><button class="copy">复制</button><code class="language-${esc(lang)}">${esc(buf.join('\n'))}</code></pre>`;buf=[];lang=''};const ist=i=>a[i]?.trim().startsWith('|')&&a[i+1]?.trim().match(/^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/);while(i<a.length){let l=a[i];if(l.trim().startsWith('```')){if(code){fc();code=false}else{code=true;lang=l.trim().slice(3).trim()}i++;continue}if(code){buf.push(l);i++;continue}if(!l.trim()){i++;continue}if(ist(i)){let th=a[i].trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());i+=2;let rows=[];while(i<a.length&&a[i].trim().startsWith('|')){rows.push(a[i].trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim()));i++}h+='<table><thead><tr>'+th.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue}let m=l.match(/^(#{1,4})\s*(.+)$/);if(m){let lv=m[1].length,t=m[2].trim(),id=slug(t);h+=`<h${lv} id="${id}">${inline(t)}</h${lv}>`;i++;continue}if(/^>\s?/.test(l)){let p=[];while(i<a.length&&/^>\s?/.test(a[i])){p.push(a[i].replace(/^>\s?/,''));i++}h+=`<blockquote>${inline(p.join('<br>'))}</blockquote>`;continue}if(/^---+$/.test(l.trim())){h+='<hr>';i++;continue}let p=[l];i++;while(i<a.length&&a[i].trim()&&!/^(#{1,4})\s/.test(a[i])&&!a[i].trim().startsWith('```')&&!ist(i)&&!/^>\s?/.test(a[i])){p.push(a[i]);i++}h+=`<p>${inline(p.join(' '))}</p>`}if(code)fc();return h}
    function docUrl(id){return `${location.href.split(/[?#]/)[0]}?doc=${encodeURIComponent(id)}`}
