            padding: 0;
            box-sizing: border-box;
        }

            width: 100%;
            margin: 0 auto;
            background: transparent;
        }

        .accent-line {

            width: 100%;
            border-radius: 4px 4px 0 0;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light), var(--primary-color));

        .content-shell {

            background: transparent;
        }

        .top-badges,
        .contact-row,
        .footer,

            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .top-badges {
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }

        .pill {
            background: var(--tag-bg);
            color: var(--primary-color);
            border: 0.5px solid var(--border-light);
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 1rem;
            overflow-wrap: anywhere;
        }

        .pill.small {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.8rem;
        }

        .title-block {
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: clamp(1.85rem, 3.2vw, 2.25rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: 0;
            margin-bottom: 0.45rem;
        }

        .gradient-title {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-left: 2px solid var(--primary-color);
            padding-left: 1rem;
            margin-top: 0.25rem;
            overflow-wrap: anywhere;
        }

        .value-grid,
        .video-notice {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .value-grid {
            margin: 0.9rem 0 0.75rem;
        }

        .video-notice {
            margin-bottom: 1rem;
        }

        .value-card,
        .contact-card,
        .video-notice-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 1rem;
            backdrop-filter: blur(2px);
        }

        .value-card {
            padding: 0.75rem 0.9rem;
        }

        .contact-card {
            padding: 0.85rem 1rem;
            margin-bottom: 0.75rem;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

            margin-top: 0.65rem;
        }

        .contact-card > .contact-row + .contact-row {
            margin-top: 0;
        }

            height: 40px;

            justify-content: center;
            flex: 0 0 auto;
            background: var(--tag-bg);
            border: 0.5px solid var(--border-light);
            border-radius: 50%;
            font-size: 1.2rem;

        }

        }

        }

        .note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
            overflow-wrap: anywhere;
        }

            background: var(--tag-bg);
            border: 0.5px solid var(--border-light);
            border-radius: 60px;
            color: var(--primary-color);

            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.3rem 1rem;
            text-decoration: none;
            white-space: nowrap;
        }

        button.action {
            background: transparent;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
        }

            padding: 0.75rem 0.85rem;
            min-width: 0;
        }

        .notice-head {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            align-items: flex-start;
            margin-bottom: 0.65rem;
        }

        .notice-kicker {
            font-size: 0.66rem;
            line-height: 1.2;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.18rem;
        }

            color: var(--primary-color);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.28;
        }

            font-weight: 600;
            line-height: 1;

            color: var(--text-secondary);
            font-size: 0.72rem;

            height: 0.38rem;

function normalizeLang(value) {
    if (!value || typeof value !== "string") return "";
    const key = value.trim().toLowerCase().replace("_", "-");
    return LANG_ALIASES[key] || LANG_ALIASES[key.split("-")[0]] || "";
}

function getQueryLang() {
    const params = new URLSearchParams(window.location.search);
    return normalizeLang(params.get("lang") || params.get("locale") || params.get("lng"));
}

function getHashLang() {
    const raw = window.location.hash.replace(/^#/, "");
    if (!raw) return "";
    const params = new URLSearchParams(raw.includes("=") ? raw : `lang=${raw}`);
    return normalizeLang(params.get("lang") || params.get("locale") || raw);
}

function getReferrerLang() {
    try {
        if (!document.referrer) return "";
        const url = new URL(document.referrer);
        const fromQuery = normalizeLang(
            url.searchParams.get("lang") ||
            url.searchParams.get("locale") ||
            url.searchParams.get("lng")
        );
        if (fromQuery) return fromQuery;

        const fromHash = normalizeLang(url.hash.replace(/^#/, ""));
        if (fromHash) return fromHash;

        const path = url.pathname.toLowerCase();
        if (/(^|\/)(en|en-us|en-gb)(\/|$)/.test(path)) return "en";
        if (/(^|\/)(zh|zh-cn|zh-hans|cn)(\/|$)/.test(path)) return "zh-CN";
    } catch (_) {}
    return "";
}

function getCookieLang() {
    const candidates = [
        "i18next",
        "i18nextLng",
        "NEXT_LOCALE",
        "locale",
        "lang",
        "language"
    ];
    const cookies = document.cookie.split(";").map((item) => item.trim());
    for (const name of candidates) {
        const prefix = `${name}=`;
        const found = cookies.find((item) => item.startsWith(prefix));
        if (!found) continue;
        const normalized = normalizeLang(decodeURIComponent(found.slice(prefix.length)));
        if (normalized) return normalized;
    }
    return "";
}

function getReadableParentLang() {
    try {
        const lang = window.parent?.document?.documentElement?.lang;
        return normalizeLang(lang);
    } catch (_) {
        return "";
    }
}

function getFrameTitleLang() {
    try {
        const title = window.frameElement?.getAttribute?.("title") || "";
        const normalizedTitle = title.trim().toLowerCase();
        if (!normalizedTitle) return "";
        if (normalizedTitle.includes("custom home")) return "en";
        if (normalizedTitle.includes("自定义主页") || normalizedTitle.includes("首頁") || normalizedTitle.includes("主页")) {
            return "zh-CN";
        }
    } catch (_) {}
    return "";
}

function detectInitialLang() {
    const fromUrl = getQueryLang() || getHashLang();
    if (fromUrl) return fromUrl;

    const fromReferrer = getReferrerLang();
    if (fromReferrer) return fromReferrer;

    const fromFrameTitle = getFrameTitleLang();
    if (fromFrameTitle) return fromFrameTitle;

    const fromParent = getReadableParentLang();
    if (fromParent) return fromParent;

    const fromCookie = getCookieLang();
    if (fromCookie) return fromCookie;

    try {
        const saved = localStorage.getItem("newtoken_locale");
        const normalized = normalizeLang(saved);
        if (normalized) return normalized;
    } catch (_) {}

    return normalizeLang(navigator.language) || "zh-CN";
}

function render(lang) {
    const nextLang = "zh-CN";
    const t = BILINGUAL_TRANSLATION;
    currentLang = nextLang;
    document.documentElement.lang = "zh-CN";
    document.title = t.title;

    document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        node.textContent = t[key] || "";
    });
    document.querySelectorAll("[data-i18n-html]").forEach((node) => {
        const key = node.getAttribute("data-i18n-html");
        node.innerHTML = t[key] || "";
    });
    document.querySelectorAll("[data-i18n-aria]").forEach((node) => {
        const key = node.getAttribute("data-i18n-aria");
        node.setAttribute("aria-label", t[key] || "");
    });

    try {
        localStorage.setItem("newtoken_locale", nextLang);
    } catch (_) {}
}

function extractMessageLang(data) {
    if (!data) return "";
    if (typeof data === "string") return normalizeLang(data);
    return normalizeLang(data.lang || data.locale || data.language || data.i18n);
}

window.addEventListener("message", (event) => {
    const allowedOrigins = new Set([
        "https://www.newtoken.club",
        "https://newtoken.club",
        window.location.origin
    ]);
    if (!allowedOrigins.has(event.origin)) return;

    const lang = extractMessageLang(event.data);
    if (lang) render(lang);
});

window.addEventListener("hashchange", () => {
    const lang = getHashLang();
    if (lang) render(lang);
});

function logLanguageProbe() {
    const params = new URLSearchParams(window.location.search);
    if (!params.has("debugLang") && !params.has("debug_lang")) return;
    console.info("[newtoken] language probe", {
        currentLang,
        query: getQueryLang(),
        hash: getHashLang(),
        referrer: document.referrer,
        referrerLang: getReferrerLang(),
        frameTitleLang: getFrameTitleLang(),
        parentLang: getReadableParentLang(),
        cookieLang: getCookieLang(),
        navigatorLanguage: navigator.language
    });
}

setInterval(() => {
    const lang = getQueryLang() || getHashLang() || getReferrerLang() || getFrameTitleLang() || getReadableParentLang() || getCookieLang();
    if (lang) render(lang);
    logLanguageProbe();
}, 1000);

window.copyToClipboard = function(content, type) {
    const finalCopy = type === "tg" ? content.replace(/^@/, "") : content;
    const t = BILINGUAL_TRANSLATION;

    const showMessage = (msg) => {
        let toast = document.querySelector(".dynamic-toast");
        if (toast) toast.remove();
        toast = document.createElement("div");
        toast.className = "dynamic-toast";
        toast.textContent = msg;
        toast.style.position = "fixed";
        toast.style.bottom = "24px";
        toast.style.left = "50%";
        toast.style.transform = "translateX(-50%)";
        toast.style.backgroundColor = "#1e2f3c";
        toast.style.color = "white";
        toast.style.padding = "0.5rem 1.2rem";
        toast.style.borderRadius = "40px";
        toast.style.fontSize = "0.8rem";
        toast.style.zIndex = "9999";
        toast.style.fontFamily = "system-ui, sans-serif";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(finalCopy).then(() => {
            showMessage(type === "tg" ? t.copiedAccount : t.copiedApi);
        }).catch(() => {
            alert(`${t.manualCopy} ${finalCopy}`);
        });
    } else {
        const textarea = document.createElement("textarea");
        textarea.value = finalCopy;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showMessage(type === "tg" ? t.copiedAccount : t.copiedApi);
    }
};

render(detectInitialLang());
</script>
</body>
</html>
